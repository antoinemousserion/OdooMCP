[project]
name = "odoo-mcp"
version = "1.0.0"
description = "MCP readonly pour explorer les codebases Odoo (community + enterprise)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
]

[project.scripts]
odoo-mcp = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_mcp"]
